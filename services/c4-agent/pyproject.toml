[project]
name = "c4-agent"
version = "0.1.0"
description = "Component 4: Tourism Orchestrator Agent (J26-DS-345)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.136.*",        # vLLM 0.34.0 needs fastapi >=0.133,<0.137
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "pyyaml==6.0.4",
    "jsonschema==4.26.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]
# Linux/WSL2 only. vLLM 0.34.0 itself pins xgrammar 0.2.8 and torch 2.14.0.
gpu = ["vllm==0.34.0; sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c4"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32'",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# Plain `pytest` (what CI runs) never needs a GPU or network.
addopts = "-ra --strict-markers -m 'not gpu and not network'"
markers = [
    "gpu: needs an NVIDIA GPU and vLLM (Linux/WSL2)",
    "slow: takes minutes",
    "network: needs internet or a teammate's real service",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
